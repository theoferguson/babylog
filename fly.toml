app = "babylog-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "0"
  PORT = "8080"
  DATABASE_URL = "sqlite:////data/babylog.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  # "stop", not "suspend": a snapshot resume hung 20 min on 2026-10-23 and left the machine dead.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Never stop the last one: idle-stop came ~9 min after the last request, so
  # nearly every open between feeds waited 2-5s for a cold boot.
  min_machines_running = 1

[[mounts]]
  source = "babylog_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
