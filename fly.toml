app = "babylog-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "0"
  PORT = "8080"
  DATABASE_URL = "sqlite:////data/babylog.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "babylog_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
